name: pages-preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'visualization/**'
      - 'reference/**'
      - 'paper/**'
      - 'supplements/**'
      - 'assets/physical_k6/**'
      - 'src/per2/export/**'
      - 'src/per2/theory/**'
      - 'tools/build_web_preview.py'
      - 'tools/check_browser_trust_boundary.py'
      - 'tools/check_public_tree.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: make site
      - name: Browser syntax and scientific-boundary policy
        run: |
          for f in web/assets/js/*.js; do node --check "$f"; done
          python tools/check_browser_trust_boundary.py
          python tools/check_accessibility_basics.py
          python tools/check_public_tree.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
