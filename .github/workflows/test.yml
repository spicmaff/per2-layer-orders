name: quick-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python tools/check_import_boundaries.py
      - run: python tools/check_reference_manifest.py
      - run: make figures
      - run: python tools/check_generated.py
      - run: make site
      - name: Browser syntax and scientific-boundary policy
        run: |
          for f in web/assets/js/*.js; do node --check "$f"; done
          python tools/check_browser_trust_boundary.py
          python tools/check_accessibility_basics.py
      - run: python tools/check_public_tree.py
