name: full-release-validation
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python tools/check_import_boundaries.py
      - run: per2 finite-validation --full > full-validation.json
      - run: per2 export-reference --root . --k2-states
      - run: make figures
      - run: python tools/check_generated.py
      - name: Refresh and verify reference manifests
        run: |
          python tools/make_reference_manifest.py
          python tools/make_checksums.py reference
          python tools/check_reference_manifest.py
      - name: Build and audit no-backend Pages artifact
        run: |
          make site
          for f in web/assets/js/*.js; do node --check "$f"; done
          python tools/check_browser_trust_boundary.py
          python tools/check_accessibility_basics.py
          python tools/check_public_tree.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation-records
          path: |
            full-validation.json
            reference/validation/k2_exact_states.json
            reference/manifests/reference-files.json
            reference/manifests/SHA256SUMS.txt
            visualization/generated/*.svg
            build/site

  publication-build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile manuscript
        working-directory: paper/source/manuscript
        run: |
          mkdir -p ../../../build/publication/paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -outdir=../../../build/publication/paper \
            PER2_MANUSCRIPT_FINAL_PUBLICATION_MASTER.tex
      - name: Compile Supplements S1-S3
        working-directory: supplements
        run: |
          mkdir -p ../build/publication/supplements
          for f in M4_SUPPLEMENT_S1_TABLES.tex M4_SUPPLEMENT_S2_VALIDATION.tex M4_SUPPLEMENT_S3_REPRODUCIBILITY.tex; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -outdir=../build/publication/supplements "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: publication-pdfs
          path: |
            build/publication/paper/*.pdf
            build/publication/supplements/*.pdf
